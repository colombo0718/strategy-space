<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>精靈餘燼 elf-embers（MVP）</title>
<link rel="icon" href="assets/openmoji/1F9DD.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1b1420;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI Emoji', sans-serif;
    gap: 10px;
    color: #eee;
  }
  h1 { font-size: 1.3rem; letter-spacing: 0.08em; }
  #gameCanvas { border: 3px solid #6a4a8a; border-radius: 8px; box-shadow: 0 6px 24px #00000055; background: #000; }
  #hint { font-size: 0.85rem; color: #cbb8d8; text-align: center; max-width: 800px; line-height: 1.6; }
</style>
</head>
<body>
<h1>🧝 精靈餘燼 elf-embers（控制系統 MVP）</h1>
<canvas id="gameCanvas" width="800" height="450"></canvas>
<div id="hint">
  A / D 移動　W 跳躍　　1 揮劍（依當下狀態自動判斷側斬/上砍/下斬）<br>
  2 弓箭——移動中點按＝水平快速點放；站定按住＝拉弓蓄力（此時 A/D/W 改為調整瞄準角度），放開即發射<br>
  <span style="opacity:.7">目前僅控制系統原型，尚無 boss／血量／勝負——<a href="../" style="color:#cbb8d8">◂ 關於本作</a>　<a href="../../" style="color:#cbb8d8">◂ 回玄機萬境大廳</a></span>
</div>

<script src="lib/emoji.js"></script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const W = 800, H = 450;
const GROUND_Y = 380;

// ════════════════════════════════
//  參數（先求可玩，數值都是佔位、之後靠試玩微調）
// ════════════════════════════════
const GRAVITY      = 0.7;
const JUMP_FORCE    = -13;
const MOVE_SPEED    = 4.5;
const ELF_SIZE      = 64;

const ATTACK_DURATION = 180; // ms，揮劍一次的動畫時長

const BOW_MIN_CHARGE_MS = 120;  // 低於此視為未真正蓄力（放開直接算最低威力）
const BOW_MAX_CHARGE_MS = 900;  // 蓄力封頂
const QUICK_SHOT_SPEED  = 9,   QUICK_SHOT_RANGE  = 260; // 移動中點放：弱、短
const CHARGED_MIN_SPEED = 10,  CHARGED_MAX_SPEED = 16;  // 站定蓄力：依蓄力量在區間內插值
const CHARGED_MIN_RANGE = 320, CHARGED_MAX_RANGE = 720;

const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ════════════════════════════════
//  精靈狀態
// ════════════════════════════════
const elf = {
  x: W / 2, y: GROUND_Y, vx: 0, vy: 0,
  facing: 1, onGround: true,
  attack: null,   // { type:'side'|'up'|'down', start: performance.now() }
};

const bow = { isDrawing: false, drawStart: 0 };

let arrows = [];

function fireArrow(angle, speed, range) {
  const originX = elf.x + elf.facing * 18, originY = elf.y - 30;
  arrows.push({
    x: originX, y: originY,
    vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
    traveled: 0, maxRange: range,
  });
}

function bowAimAngle() {
  if (keys['w'] || keys['W']) return -Math.PI / 2;               // 上鍵：正上方
  if (keys['a'] || keys['A']) return Math.PI;                    // 左鍵：水平朝左
  if (keys['d'] || keys['D']) return 0;                          // 右鍵：水平朝右
  return elf.facing > 0 ? -Math.PI / 4 : -Math.PI * 3 / 4;        // 預設：面朝方向 45°
}

// ════════════════════════════════
//  輸入
// ════════════════════════════════
const keys = {};
const justDown = {};
window.addEventListener('keydown', e => {
  if (!keys[e.key]) justDown[e.key] = true;
  keys[e.key] = true;
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ════════════════════════════════
//  更新
// ════════════════════════════════
function handleAttackInput() {
  if (justDown['1'] && !elf.attack && !bow.isDrawing) {
    let type;
    if (!elf.onGround && elf.vy < 0)      type = 'up';
    else if (!elf.onGround && elf.vy > 0) type = 'down';
    else                                  type = 'side';
    elf.attack = { type, start: performance.now() };
  }

  if (justDown['2'] && !bow.isDrawing) {
    const movingDir = (keys['a'] || keys['A']) ? -1 : (keys['d'] || keys['D']) ? 1 : 0;
    if (movingDir !== 0) {
      // 移動中點按 → 立刻水平點放，不蓄力、不鎖移動
      fireArrow(movingDir > 0 ? 0 : Math.PI, QUICK_SHOT_SPEED, QUICK_SHOT_RANGE);
    } else {
      bow.isDrawing = true;
      bow.drawStart = performance.now();
    }
  }
  if (!keys['2'] && bow.isDrawing) {
    const heldMs = performance.now() - bow.drawStart;
    const t = clamp((heldMs - BOW_MIN_CHARGE_MS) / (BOW_MAX_CHARGE_MS - BOW_MIN_CHARGE_MS), 0, 1);
    fireArrow(bowAimAngle(), lerp(CHARGED_MIN_SPEED, CHARGED_MAX_SPEED, t), lerp(CHARGED_MIN_RANGE, CHARGED_MAX_RANGE, t));
    bow.isDrawing = false;
  }
}

function update() {
  handleAttackInput();

  // 拉弓期間：方向鍵語意換成瞄準，移動鎖死
  if (bow.isDrawing) {
    elf.vx = 0;
  } else {
    if (keys['a'] || keys['A']) { elf.vx = -MOVE_SPEED; elf.facing = -1; }
    else if (keys['d'] || keys['D']) { elf.vx = MOVE_SPEED; elf.facing = 1; }
    else elf.vx = 0;

    if (justDown['w'] || justDown['W']) {
      if (elf.onGround) { elf.vy = JUMP_FORCE; elf.onGround = false; }
    }
  }

  // 重力＋位移
  elf.vy += GRAVITY;
  elf.x += elf.vx;
  elf.y += elf.vy;
  if (elf.y >= GROUND_Y) { elf.y = GROUND_Y; elf.vy = 0; elf.onGround = true; }
  elf.x = clamp(elf.x, ELF_SIZE / 2, W - ELF_SIZE / 2);

  // 揮劍動畫計時
  if (elf.attack && performance.now() - elf.attack.start >= ATTACK_DURATION) elf.attack = null;

  // 箭矢
  arrows.forEach(a => {
    const step = Math.hypot(a.vx, a.vy);
    a.x += a.vx; a.y += a.vy; a.traveled += step;
  });
  arrows = arrows.filter(a => a.traveled < a.maxRange && a.x > -20 && a.x < W + 20 && a.y > -20 && a.y < H + 20);

  for (const k in justDown) delete justDown[k];
}

// ════════════════════════════════
//  繪製
// ════════════════════════════════
function drawScene() {
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, '#2a1f3d'); grad.addColorStop(1, '#4a3363');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, GROUND_Y);

  const gGrad = ctx.createLinearGradient(0, GROUND_Y, 0, H);
  gGrad.addColorStop(0, '#3d2e1a'); gGrad.addColorStop(1, '#241a0f');
  ctx.fillStyle = gGrad; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke();
}

// 揮劍弧形角度（局部座標，面朝右時的角度；面朝左時鏡射）
function attackArc(type, t) {
  if (type === 'side') return lerp(-0.9, 0.9, t);
  if (type === 'up')   return lerp(-2.6, -0.5, t);
  return lerp(0.5, 2.6, t); // down
}

function drawElf() {
  drawEmoji(ctx, '🧝', elf.x, elf.y - ELF_SIZE / 2, ELF_SIZE, { flip: elf.facing < 0 });

  if (elf.attack) {
    const t = clamp((performance.now() - elf.attack.start) / ATTACK_DURATION, 0, 1);
    let angle = attackArc(elf.attack.type, t);
    if (elf.facing < 0) angle = Math.PI - angle; // 鏡射到左側
    const pivotX = elf.x + elf.facing * 14, pivotY = elf.y - 34;
    // dy 把圖案的握把端往軸心對齊（佔位值，之後照實際渲染微調）
    drawEmoji(ctx, '🗡️', pivotX, pivotY, 40, { rotate: angle, dy: 12 });
  }

  if (bow.isDrawing) {
    const angle = bowAimAngle();
    drawEmoji(ctx, '🏹', elf.x + elf.facing * 10, elf.y - 32, 34, { rotate: angle, flip: elf.facing < 0 });
    // 蓄力條
    const heldMs = clamp(performance.now() - bow.drawStart, 0, BOW_MAX_CHARGE_MS);
    const t = heldMs / BOW_MAX_CHARGE_MS;
    ctx.fillStyle = '#000a'; ctx.fillRect(elf.x - 24, elf.y - 62, 48, 6);
    ctx.fillStyle = '#ffd24a'; ctx.fillRect(elf.x - 24, elf.y - 62, 48 * t, 6);
  }
}

function drawArrows() {
  arrows.forEach(a => {
    const angle = Math.atan2(a.vy, a.vx);
    ctx.save();
    ctx.translate(a.x, a.y); ctx.rotate(angle);
    ctx.strokeStyle = '#e8d9a0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = '#e8d9a0';
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}

function gameLoop() {
  update();
  ctx.clearRect(0, 0, W, H);
  drawScene();
  drawArrows();
  drawElf();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
