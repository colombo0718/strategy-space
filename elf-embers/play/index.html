<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>精靈餘燼 elf-embers（控制系統 MVP v2）</title>
<link rel="icon" href="assets/openmoji/1F9DD.svg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1b1420;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI Emoji', sans-serif;
    gap: 10px;
    color: #eee;
  }
  h1 { font-size: 1.3rem; letter-spacing: 0.08em; }
  #gameCanvas { border: 3px solid #6a4a8a; border-radius: 8px; box-shadow: 0 6px 24px #00000055; background: #000; cursor: crosshair; }
  #hint { font-size: 0.85rem; color: #cbb8d8; text-align: center; max-width: 800px; line-height: 1.6; }
  #hud { font-size: 0.8rem; color: #ffd24a; text-align: center; font-family: 'Consolas', monospace; }
</style>
</head>
<body>
<h1>🧝 精靈餘燼 elf-embers（控制系統 MVP v2 — 滑鼠瞄準）</h1>
<canvas id="gameCanvas" width="800" height="450"></canvas>
<div id="hud">速度倍率 —　｜　最近攻擊傷害倍率 —</div>
<div id="hint">
  A / D 移動　W 跳躍　　滑鼠移動＝瞄準方向（弓劍共用）<br>
  1 或滑鼠左鍵：短劍刺出收回（方向鎖在按下瞬間的瞄準方向）<br>
  2 或滑鼠右鍵：弓箭——移動中點按＝快速點放；站定按住＝拉弓蓄力（此時鎖移動，瞄準仍跟滑鼠）<br>
  <span style="opacity:.7">面向與移動方向對齊＝速度/傷害加成；背向＝減益（永遠有基礎值，不會歸零或負值）</span><br>
  <span style="opacity:.7">目前僅控制系統原型，尚無 boss／血量／勝負——<a href="../" style="color:#cbb8d8">◂ 關於本作</a>　<a href="../../" style="color:#cbb8d8">◂ 回玄機萬境大廳</a></span>
</div>

<script src="lib/emoji.js"></script>
<script>
const canvas = document.getElementById('gameCanvas');
const ctx    = canvas.getContext('2d');
const hud    = document.getElementById('hud');
const W = 800, H = 450;
const GROUND_WORLD_Y = 380; // 地面世界座標（垂直），跳躍時人物離這個基準線的距離
const ELF_SCREEN_Y   = 300; // 人物永遠釘死的螢幕Y座標（鏡頭水平+垂直都鎖角色）

// ════════════════════════════════
//  參數（先求可玩，數值都是佔位、之後靠試玩微調）
// ════════════════════════════════
const GRAVITY      = 0.7;
const JUMP_FORCE    = -13;
const MOVE_SPEED    = 4.5;
const ELF_SIZE      = 64;

const ATTACK_DURATION = 130; // ms，短劍刺出收回一次的動畫時長（加快）
const THRUST_OUT_FRAC = 0.35; // 動畫前 35% 時間快速刺出、剩下 65% 收回

// OpenMoji 原始素材畫面本身不是朝右擺（0度基準），套用旋轉前要先校正回「朝右」的基準角度
// 校正值來自實際比對素材圖：弓箭圖案原始朝向約左上45度（順時針轉45度校正回朝右）
//                          短劍圖案原始朝向約左上135度（逆時針轉135度／即-135度校正回朝右）
const BOW_ROTATE_OFFSET   = Math.PI / 4;        // +45度（順時針）
const SWORD_ROTATE_OFFSET = -Math.PI * 3 / 4;   // -135度（逆時針135度）

const WEAPON_REACH_SWORD = 44; // 短劍刺出最遠距離
const WEAPON_REACH_BOW   = 24;

const BOW_MIN_CHARGE_MS = 120;  // 低於此視為未真正蓄力（放開直接算最低威力）
const BOW_MAX_CHARGE_MS = 900;  // 蓄力封頂
const QUICK_SHOT_SPEED  = 9,   QUICK_SHOT_RANGE  = 260; // 移動中點放：弱、短
const CHARGED_MIN_SPEED = 10,  CHARGED_MAX_SPEED = 16;  // 站定蓄力：依蓄力量在區間內插值
const CHARGED_MIN_RANGE = 320, CHARGED_MAX_RANGE = 720;

// 面向/移動對齊 → 速度、傷害的加減波動振幅（1±k，永遠正值、永遠有基礎在）
const K_SPEED = 0.3;
const K_DAMAGE = 0.3;

const TICK_SPACING = 60; // 地面刻度間距（世界座標），純視覺、讓鏡頭鎖定看得出世界在捲動

const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ════════════════════════════════
//  精靈狀態（worldX/worldY＝世界座標，可無限延伸；螢幕座標永遠釘死在畫面中心一點，
//  水平垂直都鎖角色——世界相對角色捲動，不是角色在畫面裡移動）
// ════════════════════════════════
const elf = {
  worldX: 0, worldY: GROUND_WORLD_Y, vx: 0, vy: 0,
  onGround: true,
  facing: 1,   // 人物圖案左右面向，由左右按鍵決定（不是瞄準方向），靜止時沿用上次的值
  attack: null,   // { center: 弧度, start: performance.now() }
};

// 黏滯移動方向向量（沒有輸入時凍結在最後一次非零方向，不歸零，供 cos 對齊計算用）
const moveDir = { x: 1, y: 0 };

const bow = { isDrawing: false, drawStart: 0 };

let arrows = []; // 箭矢座標一律存世界座標，畫的時候才轉螢幕座標

let speedMult = 1, lastDamageMult = 1;

function worldToScreenX(wx) { return wx - elf.worldX + W / 2; }
function worldToScreenY(wy) { return wy - elf.worldY + ELF_SCREEN_Y; }
function elfScreenX() { return W / 2; }
function elfScreenY() { return ELF_SCREEN_Y - 30; } // 瞄準基準點，約胸口高度，永遠固定（人物釘死在螢幕上）

// ════════════════════════════════
//  滑鼠瞄準
// ════════════════════════════════
const mouse = { x: W / 2, y: H / 2 };
canvas.addEventListener('mousemove', e => {
  const rect = canvas.getBoundingClientRect();
  mouse.x = e.clientX - rect.left - canvas.clientLeft;
  mouse.y = e.clientY - rect.top - canvas.clientTop;
});

function aimAngle() {
  return Math.atan2(mouse.y - elfScreenY(), mouse.x - elfScreenX());
}

function fireArrow(angle, speed, range) {
  const originWorldX = elf.worldX + Math.cos(angle) * 18;
  const originWorldY = elf.worldY - 30 + Math.sin(angle) * 18;
  arrows.push({
    worldX: originWorldX, worldY: originWorldY,
    // 出手瞬間疊加人物本身的速度向量（速度合成）——邊跑邊射會比站定射更快更遠，符合物理
    vx: Math.cos(angle) * speed + elf.vx, vy: Math.sin(angle) * speed + elf.vy,
    traveled: 0, maxRange: range,
  });
}

// ════════════════════════════════
//  對齊倍率：1 + k×cos(向量A · 向量B)，永遠正值、永遠有基礎在
// ════════════════════════════════
function alignMultiplier(angleA, dirBx, dirBy, k) {
  const len = Math.hypot(dirBx, dirBy) || 1;
  const bx = dirBx / len, by = dirBy / len;
  const ax = Math.cos(angleA), ay = Math.sin(angleA);
  const cosTheta = ax * bx + ay * by;
  return 1 + k * cosTheta;
}

// ════════════════════════════════
//  輸入
// ════════════════════════════════
const keys = {};
const justDown = {};
window.addEventListener('keydown', e => {
  if (!keys[e.key]) justDown[e.key] = true;
  keys[e.key] = true;
});
window.addEventListener('keyup', e => { keys[e.key] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// 滑鼠左右鍵：左鍵進戰(同 1 鍵)、右鍵遠程(同 2 鍵)，跟鍵盤共用同一套 keys/justDown
canvas.addEventListener('mousedown', e => {
  const k = e.button === 0 ? 'Mouse0' : e.button === 2 ? 'Mouse2' : null;
  if (!k) return;
  if (!keys[k]) justDown[k] = true;
  keys[k] = true;
});
canvas.addEventListener('mouseup', e => {
  const k = e.button === 0 ? 'Mouse0' : e.button === 2 ? 'Mouse2' : null;
  if (k) keys[k] = false;
});
canvas.addEventListener('contextmenu', e => e.preventDefault()); // 擋掉右鍵瀏覽器選單，右鍵才能拿來玩

// ════════════════════════════════
//  更新
// ════════════════════════════════
function handleAttackInput() {
  const angle = aimAngle();

  if ((justDown['1'] || justDown['Mouse0']) && !elf.attack && !bow.isDrawing) {
    lastDamageMult = alignMultiplier(angle, moveDir.x, moveDir.y, K_DAMAGE);
    elf.attack = { center: angle, start: performance.now() };
  }

  if ((justDown['2'] || justDown['Mouse2']) && !bow.isDrawing) {
    const movingDir = (keys['a'] || keys['A']) ? -1 : (keys['d'] || keys['D']) ? 1 : 0;
    if (movingDir !== 0) {
      // 移動中點按 → 立刻沿瞄準方向水平點放，不蓄力、不鎖移動
      lastDamageMult = alignMultiplier(angle, moveDir.x, moveDir.y, K_DAMAGE);
      fireArrow(angle, QUICK_SHOT_SPEED, QUICK_SHOT_RANGE);
    } else {
      bow.isDrawing = true;
      bow.drawStart = performance.now();
    }
  }
  if (!keys['2'] && !keys['Mouse2'] && bow.isDrawing) {
    const heldMs = performance.now() - bow.drawStart;
    const t = clamp((heldMs - BOW_MIN_CHARGE_MS) / (BOW_MAX_CHARGE_MS - BOW_MIN_CHARGE_MS), 0, 1);
    lastDamageMult = alignMultiplier(angle, moveDir.x, moveDir.y, K_DAMAGE);
    fireArrow(angle, lerp(CHARGED_MIN_SPEED, CHARGED_MAX_SPEED, t), lerp(CHARGED_MIN_RANGE, CHARGED_MAX_RANGE, t));
    bow.isDrawing = false;
  }
}

function update() {
  handleAttackInput();
  const angle = aimAngle();

  // 拉弓期間：移動鎖死，瞄準仍跟滑鼠
  if (bow.isDrawing) {
    elf.vx = 0;
  } else {
    let inputX = 0;
    if (keys['a'] || keys['A']) inputX = -1;
    else if (keys['d'] || keys['D']) inputX = 1;
    if (inputX !== 0) elf.facing = inputX; // 人物左右面向：只由按鍵決定，靜止時沿用上次

    if (inputX !== 0) {
      speedMult = alignMultiplier(angle, inputX, 0, K_SPEED);
      elf.vx = MOVE_SPEED * speedMult * inputX;
    } else {
      elf.vx = 0;
    }

    if (justDown['w'] || justDown['W']) {
      if (elf.onGround) { elf.vy = JUMP_FORCE; elf.onGround = false; }
    }
  }

  // 重力＋位移（世界座標，水平垂直都是——鏡頭鎖角色，世界跟著相對捲動）
  elf.vy += GRAVITY;
  elf.worldX += elf.vx;
  elf.worldY += elf.vy;
  if (elf.worldY >= GROUND_WORLD_Y) { elf.worldY = GROUND_WORLD_Y; elf.vy = 0; elf.onGround = true; }

  // 黏滯移動方向：只在真的有位移時更新，靜止時凍結上一刻的值（避免零向量 undefined）
  if (Math.abs(elf.vx) > 0.01 || Math.abs(elf.vy) > 0.01) {
    moveDir.x = elf.vx; moveDir.y = elf.vy;
  }

  // 揮劍動畫計時
  if (elf.attack && performance.now() - elf.attack.start >= ATTACK_DURATION) elf.attack = null;

  // 箭矢（世界座標位移，重力跟人物共用同一顆常數，形成拋物線）
  arrows.forEach(a => {
    a.vy += GRAVITY;
    const step = Math.hypot(a.vx, a.vy);
    a.worldX += a.vx; a.worldY += a.vy; a.traveled += step;
  });
  arrows = arrows.filter(a => {
    const sx = worldToScreenX(a.worldX), sy = worldToScreenY(a.worldY);
    return a.traveled < a.maxRange && a.worldY < GROUND_WORLD_Y
      && sx > -20 && sx < W + 20 && sy > -20 && sy < H + 20;
  });

  for (const k in justDown) delete justDown[k];

  hud.textContent = `速度倍率 ${speedMult.toFixed(2)}　｜　最近攻擊傷害倍率 ${lastDamageMult.toFixed(2)}`;
}

// ════════════════════════════════
//  繪製
// ════════════════════════════════
function drawScene() {
  const groundSY = worldToScreenY(GROUND_WORLD_Y); // 地面的螢幕Y——跳躍時這條線會跟著相對移動、人物螢幕位置不變

  const grad = ctx.createLinearGradient(0, 0, 0, groundSY);
  grad.addColorStop(0, '#2a1f3d'); grad.addColorStop(1, '#4a3363');
  ctx.fillStyle = grad; ctx.fillRect(0, 0, W, Math.max(groundSY, 0));

  const gGrad = ctx.createLinearGradient(0, groundSY, 0, H);
  gGrad.addColorStop(0, '#3d2e1a'); gGrad.addColorStop(1, '#241a0f');
  ctx.fillStyle = gGrad; ctx.fillRect(0, groundSY, W, H - groundSY);
  ctx.strokeStyle = '#6a4a2a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, groundSY); ctx.lineTo(W, groundSY); ctx.stroke();

  // 地面刻度：世界座標捲動視覺化，證明鏡頭真的鎖在角色身上、是世界在動
  ctx.strokeStyle = '#8a6a3a55'; ctx.lineWidth = 2;
  const startTick = Math.floor((elf.worldX - W / 2) / TICK_SPACING) * TICK_SPACING;
  for (let wx = startTick; wx < elf.worldX + W / 2 + TICK_SPACING; wx += TICK_SPACING) {
    const sx = worldToScreenX(wx);
    ctx.beginPath(); ctx.moveTo(sx, groundSY); ctx.lineTo(sx, groundSY + 14); ctx.stroke();
  }
}

function drawElf() {
  const angle = aimAngle();
  const facingLeft = elf.facing < 0;
  // 人物永遠畫在螢幕固定點（水平垂直都鎖），不會因為跳躍而在畫面裡上下移動——
  // 是地面／世界相對它移動，鏡頭「永遠對準他」
  drawEmoji(ctx, '🧝', elfScreenX(), ELF_SCREEN_Y - ELF_SIZE / 2, ELF_SIZE, { flip: facingLeft });

  if (elf.attack) {
    const t = clamp((performance.now() - elf.attack.start) / ATTACK_DURATION, 0, 1);
    // 方向鎖死在按下攻擊瞬間的專注方向（elf.attack.center），動畫中不再轉動；
    // 動的是「離身體多遠」——前 35% 快速刺出到最遠、剩下 65% 收回，直線刺出收回、不掃扇形
    const reachT = t < THRUST_OUT_FRAC
      ? t / THRUST_OUT_FRAC
      : 1 - (t - THRUST_OUT_FRAC) / (1 - THRUST_OUT_FRAC);
    const reach = lerp(14, WEAPON_REACH_SWORD, reachT);
    const pivotX = elfScreenX() + Math.cos(elf.attack.center) * reach;
    const pivotY = (ELF_SCREEN_Y - 34) + Math.sin(elf.attack.center) * reach;
    drawEmoji(ctx, '🗡️', pivotX, pivotY, 50, { rotate: elf.attack.center + SWORD_ROTATE_OFFSET, dy: 12 });
  }

  if (bow.isDrawing) {
    // 弓箭已有完整360度連續旋轉、本身就能指向任何方向，不能再加 flip——
    // flip(scale(-1,1)) 是在旋轉後的座標系裡鏡射，跟 rotate 疊加會算出錯的角度
    drawEmoji(ctx, '🏹', elfScreenX() + Math.cos(angle) * WEAPON_REACH_BOW, (ELF_SCREEN_Y - 32) + Math.sin(angle) * WEAPON_REACH_BOW, 44, { rotate: angle + BOW_ROTATE_OFFSET });
  }

  // 瞄準線（細，輔助測試用）
  ctx.strokeStyle = '#ffffff33'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(elfScreenX(), elfScreenY());
  ctx.lineTo(elfScreenX() + Math.cos(angle) * 40, elfScreenY() + Math.sin(angle) * 40);
  ctx.stroke();
}

// 蓄力條：固定畫在畫布左上角的HUD位置，跟人物/武器完全脫鉤——
// 原本釘在頭頂正上方，弓箭朝上瞄準時圖案會疊到擋住，改成固定角落就不會再被任何瞄準角度擋到
function drawChargeBar() {
  if (!bow.isDrawing) return;
  const heldMs = clamp(performance.now() - bow.drawStart, 0, BOW_MAX_CHARGE_MS);
  const t = heldMs / BOW_MAX_CHARGE_MS;
  ctx.fillStyle = '#cbb8d8'; ctx.font = '12px sans-serif'; ctx.fillText('蓄力', 16, 26);
  ctx.fillStyle = '#000a'; ctx.fillRect(16, 32, 100, 10);
  ctx.fillStyle = '#ffd24a'; ctx.fillRect(16, 32, 100 * t, 10);
}

function drawArrows() {
  arrows.forEach(a => {
    const sx = worldToScreenX(a.worldX), sy = worldToScreenY(a.worldY);
    const angle = Math.atan2(a.vy, a.vx);
    ctx.save();
    ctx.translate(sx, sy); ctx.rotate(angle);
    ctx.strokeStyle = '#e8d9a0'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.stroke();
    ctx.fillStyle = '#e8d9a0';
    ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(4, -3); ctx.lineTo(4, 3); ctx.closePath(); ctx.fill();
    ctx.restore();
  });
}

function gameLoop() {
  update();
  ctx.clearRect(0, 0, W, H);
  drawScene();
  drawArrows();
  drawElf();
  drawChargeBar();
  requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
